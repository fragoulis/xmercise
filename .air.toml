# Config file for Air: https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/companies ./cmd/exercise"
bin = "./tmp/companies"
include_ext = ["go"]
include_file = ["config.yaml"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
